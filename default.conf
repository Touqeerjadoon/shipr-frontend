server {
    listen 8080 default_server;

    root /usr/share/nginx/html;
    index index.html;

    access_log /var/log/nginx/access.log;

    location / {
        try_files $uri /index.html;
    }

    location /inventory {
        try_files $uri /index.html;
    }

    location /payment {
        try_files $uri /index.html;
    }

    error_page 404 /index.html;
}
